spring:
  application:
    name: token-service
  datasource:
    # 預設 H2 記憶體模式；要保留資料可改為 jdbc:h2:file:./data/tokenservice
    url: jdbc:h2:mem:tokenservice;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      # 每次啟動執行 schema.sql / data.sql（兩者皆可重複執行）
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

app:
  keys:
    # PEM 格式：私鑰為 PKCS#8（BEGIN PRIVATE KEY），公鑰為 X.509（BEGIN PUBLIC KEY）。
    # 兩檔皆不存在時，啟動會自動產生 2048-bit 金鑰對並寫入此處。
    private-key-path: ./keys/private.pem
    public-key-path: ./keys/public.pem
  jwt:
    issuer: http://localhost:8080
    ttl: 15m
  jwks:
    cache-max-age: 300s
